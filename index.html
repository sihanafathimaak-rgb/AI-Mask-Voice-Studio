<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Mask & Voice Studio</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#050509;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    text-align:center;
    padding:25px 10px;
}

header h1{
    font-size:32px;
    margin-bottom:8px;
}

header p{
    color:#aaa;
}

.app{
    width:94%;
    max-width:1100px;
    margin:auto;
}

#loading{
    text-align:center;
    padding:15px;
    color:#aaa;
}

.camera-area{
    position:relative;
    width:100%;
    max-width:850px;
    margin:20px auto;
    background:#000;
    border:2px solid #303044;
    border-radius:20px;
    overflow:hidden;
}

#video{
    width:100%;
    display:block;
    background:#000;
    transform:scaleX(-1);
}

#overlay{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

.status{
    position:absolute;
    top:15px;
    left:15px;
    padding:9px 14px;
    border-radius:20px;
    background:rgba(0,0,0,.7);
    z-index:5;
}

.live{
    position:absolute;
    top:15px;
    right:15px;
    background:#d52b5c;
    padding:8px 13px;
    border-radius:20px;
    z-index:5;
}

.controls{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
    margin:22px auto;
}

.panel{
    background:#101018;
    border:1px solid #292936;
    border-radius:18px;
    padding:18px;
}

.panel h2{
    font-size:18px;
    margin-bottom:15px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
}

button{
    border:none;
    padding:11px 14px;
    border-radius:12px;
    background:#24242f;
    color:white;
    cursor:pointer;
    font-size:14px;
}

button:hover{
    background:#3a3a4b;
}

button.active{
    background:#704cff;
}

button.on{
    background:#07885c;
}

button.off{
    background:#9b2828;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:8px;
    color:#bbb;
}

input[type="range"]{
    width:100%;
}

.info{
    text-align:center;
    color:#888;
    padding:20px;
    font-size:13px;
}
</style>
</head>

<body>

<header>
    <h1>🎭 AI Mask & Voice Studio</h1>
    <p>Real-Time Face Masks + Character Voice Effects</p>
</header>

<div class="app">

<div id="loading">
    📷 Starting camera...
</div>

<div class="camera-area">

    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="overlay"></canvas>

    <div class="status" id="faceStatus">
        👤 Waiting for face...
    </div>

    <div class="live">
        🔴 LIVE
    </div>

</div>


<div class="controls">

<!-- MASK -->

<div class="panel">

<h2>🎭 Choose Mask</h2>

<div class="buttons">

<button class="maskBtn active" data-mask="none">
❌ None
</button>

<button class="maskBtn" data-mask="robot">
🤖 Robot
</button>

<button class="maskBtn" data-mask="alien">
👽 Alien
</button>

<button class="maskBtn" data-mask="monster">
👹 Monster
</button>

<button class="maskBtn" data-mask="cyber">
🕶️ Cyber
</button>

<button class="maskBtn" data-mask="magic">
✨ Magic
</button>

</div>
</div>


<!-- VOICE -->

<div class="panel">

<h2>🎙️ Voice Effect</h2>

<div class="buttons">

<button class="voiceBtn active" data-voice="normal">
🎤 Normal
</button>

<button class="voiceBtn" data-voice="robot">
🤖 Robot
</button>

<button class="voiceBtn" data-voice="alien">
👽 Alien
</button>

<button class="voiceBtn" data-voice="monster">
👹 Monster
</button>

<button class="voiceBtn" data-voice="deep">
🎬 Deep
</button>

<button class="voiceBtn" data-voice="high">
🐿️ High
</button>

</div>

<label>Voice Intensity</label>

<input
    id="voiceIntensity"
    type="range"
    min="0"
    max="100"
    value="50">

</div>


<!-- MICROPHONE -->

<div class="panel">

<h2>🎙️ Microphone</h2>

<div class="buttons">

<button id="micBtn" class="on">
🎙️ Turn Mic ON
</button>

<button id="muteBtn">
🔇 Mute
</button>

</div>

<p id="micStatus" style="margin-top:12px;color:#aaa;">
Microphone is OFF
</p>

</div>


<!-- FACE EFFECTS -->

<div class="panel">

<h2>✨ Face Effects</h2>

<div class="buttons">

<button id="particlesBtn">
✨ Particles
</button>

<button id="glowBtn">
💫 Glow
</button>

<button id="scanBtn">
🔵 Scanner
</button>

</div>

</div>

</div>

<div class="info">
Allow camera and microphone permissions when requested.
</div>

</div>


<!-- MediaPipe -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script>

/* =====================================
   VARIABLES
===================================== */

const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");

const loading = document.getElementById("loading");
const faceStatus = document.getElementById("faceStatus");

let currentMask = "none";
let currentVoice = "normal";

let particlesEnabled = false;
let glowEnabled = false;
let scanEnabled = false;

let micStream = null;
let audioContext = null;
let sourceNode = null;
let filterNode = null;


/* =====================================
   MASK BUTTONS
===================================== */

document.querySelectorAll(".maskBtn").forEach(function(button){

    button.addEventListener("click",function(){

        document.querySelectorAll(".maskBtn")
        .forEach(function(b){
            b.classList.remove("active");
        });

        button.classList.add("active");

        currentMask = button.dataset.mask;

    });

});


/* =====================================
   VOICE BUTTONS
===================================== */

document.querySelectorAll(".voiceBtn").forEach(function(button){

    button.addEventListener("click",function(){

        document.querySelectorAll(".voiceBtn")
        .forEach(function(b){
            b.classList.remove("active");
        });

        button.classList.add("active");

        currentVoice = button.dataset.voice;

        updateVoice();

    });

});


/* =====================================
   PARTICLES BUTTON
===================================== */

document.getElementById("particlesBtn")
.addEventListener("click",function(){

    particlesEnabled = !particlesEnabled;

    this.classList.toggle(
        "active",
        particlesEnabled
    );

});


/* =====================================
   GLOW BUTTON
===================================== */

document.getElementById("glowBtn")
.addEventListener("click",function(){

    glowEnabled = !glowEnabled;

    this.classList.toggle(
        "active",
        glowEnabled
    );

});


/* =====================================
   SCANNER BUTTON
===================================== */

document.getElementById("scanBtn")
.addEventListener("click",function(){

    scanEnabled = !scanEnabled;

    this.classList.toggle(
        "active",
        scanEnabled
    );

});


/* =====================================
   CAMERA
===================================== */

async function startCamera(){

    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video:{
                    facingMode:"user"
                },
                audio:false
            });

        video.srcObject = stream;

        await video.play();

        loading.innerText =
            "🟢 Camera started — detecting face...";

        startFaceTracking();

    }
    catch(error){

        console.error(error);

        loading.innerText =
            "❌ Camera permission denied";

    }

}

startCamera();


/* =====================================
   FACE MESH
===================================== */

let faceMesh = null;

function startFaceTracking(){

    if(typeof FaceMesh === "undefined"){

        loading.innerText =
            "❌ Face tracking library not loaded";

        return;
    }

    faceMesh = new FaceMesh({

        locateFile: function(file){
            return "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" + file;
        }

    });

    faceMesh.setOptions({

        maxNumFaces:1,

        refineLandmarks:true,

        minDetectionConfidence:0.5,

        minTrackingConfidence:0.5

    });


    faceMesh.onResults(function(results){

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        if(
            results.multiFaceLandmarks &&
            results.multiFaceLandmarks.length > 0
        ){

            faceStatus.innerText =
                "🟢 Face Detected";

            drawMask(
                results.multiFaceLandmarks[0]
            );

        }
        else{

            faceStatus.innerText =
                "👤 Searching for face...";

        }

    });


    detectFace();

}


/* =====================================
   FACE DETECTION LOOP
===================================== */

async function detectFace(){

    if(
        faceMesh &&
        video.readyState >= 2 &&
        video.videoWidth > 0
    ){

        try{

            await faceMesh.send({
                image:video
            });

        }
        catch(error){

            console.error(
                "Face error:",
                error
            );

        }

    }

    requestAnimationFrame(detectFace);
/* =====================================
   MICROPHONE
===================================== */

document.getElementById("micBtn")
.addEventListener("click", async function(){

    try{

        if(!micStream){

            micStream =
                await navigator.mediaDevices
                .getUserMedia({
                    audio:true
                });

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

            sourceNode =
                audioContext
                .createMediaStreamSource(
                    micStream
                );

            filterNode =
                audioContext
                .createBiquadFilter();

            filterNode.type = "lowpass";

            sourceNode
                .connect(filterNode)
                .connect(audioContext.destination);

        }

        micStream.getAudioTracks()[0].enabled = true;

        document.getElementById("micStatus")
            .innerText = "🟢 Microphone is ON";

        this.innerText = "🔴 Microphone ON";

        this.classList.remove("on");
        this.classList.add("off");

    }
    catch(error){

        console.error(error);

        document.getElementById("micStatus")
            .innerText =
            "❌ Microphone permission denied";

    }

});


/* =====================================
   MUTE
===================================== */

document.getElementById("muteBtn")
.addEventListener("click", function(){

    if(!micStream){
        return;
    }

    const track =
        micStream.getAudioTracks()[0];

    track.enabled = !track.enabled;

    if(track.enabled){

        this.innerText = "🔇 Mute";

        document.getElementById("micStatus")
            .innerText =
            "🟢 Microphone is ON";

    }
    else{

        this.innerText = "🔊 Unmute";

        document.getElementById("micStatus")
            .innerText =
            "🔇 Microphone Muted";

    }

});


/* =====================================
   VOICE INTENSITY
===================================== */

document.getElementById("voiceIntensity")
.addEventListener("input", updateVoice);


function updateVoice(){

    if(!filterNode){
        return;
    }

    const intensity =
        Number(
            document.getElementById(
                "voiceIntensity"
            ).value
        );

    if(currentVoice === "normal"){

        filterNode.frequency.value = 20000;

    }
    else if(currentVoice === "robot"){

        filterNode.frequency.value =
            1200 + intensity * 20;

    }
    else if(currentVoice === "alien"){

        filterNode.frequency.value =
            3000 + intensity * 30;

    }
    else if(currentVoice === "monster"){

        filterNode.frequency.value =
            500 + intensity * 10;

    }
    else if(currentVoice === "deep"){

        filterNode.frequency.value =
            700 + intensity * 8;

    }
    else if(currentVoice === "high"){

        filterNode.frequency.value =
            5000 + intensity * 40;

    }

}


/* =====================================
   GET FACE POINT
===================================== */

function getPoint(landmarks,index){

    const p = landmarks[index];

    return {
        x:(1-p.x) * canvas.width,
        y:p.y * canvas.height
    };

}


/* =====================================
   DRAW MASK
===================================== */

function drawMask(lm){

    const left =
        getPoint(lm,33);

    const right =
        getPoint(lm,263);

    const top =
        getPoint(lm,10);

    const bottom =
        getPoint(lm,152);

    const centerX =
        (left.x + right.x) / 2;

    const centerY =
        (top.y + bottom.y) / 2;

    const width =
        Math.abs(right.x-left.x) * 2.3;

    const height =
        Math.abs(bottom.y-top.y) * 1.2;


    ctx.save();

    ctx.translate(
        centerX,
        centerY
    );


    if(glowEnabled){

        ctx.shadowBlur = 25;
        ctx.shadowColor = "#8b5cff";

    }


    if(currentMask === "robot"){
        robotMask(width,height);
    }

    else if(currentMask === "alien"){
        alienMask(width,height);
    }

    else if(currentMask === "monster"){
        monsterMask(width,height);
    }

    else if(currentMask === "cyber"){
        cyberMask(width,height);
    }

    else if(currentMask === "magic"){
        magicMask(width,height);
    }


    ctx.restore();


    if(particlesEnabled){
        particles(centerX,centerY);
    }

    if(scanEnabled){
        scanner(
            centerX,
            centerY,
            width,
            height
        );
    }

}


/* =====================================
   ROBOT MASK
===================================== */

function robotMask(w,h){

    ctx.fillStyle =
        "rgba(100,110,125,0.9)";

    ctx.beginPath();

    ctx.roundRect(
        -w/2,
        -h/2,
        w,
        h,
        25
    );

    ctx.fill();


    ctx.fillStyle = "#050505";

    ctx.fillRect(
        -w*0.38,
        -h*0.14,
        w*0.76,
        h*0.18
    );


    ctx.fillStyle = "#00ffff";

    ctx.beginPath();

    ctx.arc(
        -w*0.22,
        -h*0.05,
        w*0.06,
        0,
        Math.PI*2
    );

    ctx.arc(
        w*0.22,
        -h*0.05,
        w*0.06,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================
   ALIEN MASK
===================================== */

function alienMask(w,h){

    ctx.fillStyle =
        "rgba(80,220,120,0.75)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        0,
        w*0.55,
        h*0.58,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle = "#020202";

    ctx.beginPath();

    ctx.ellipse(
        -w*0.22,
        -h*0.08,
        w*0.14,
        h*0.23,
        0,
        0,
        Math.PI*2
    );

    ctx.ellipse(
        w*0.22,
        -h*0.08,
        w*0.14,
        h*0.23,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================
   MONSTER MASK
===================================== */

function monsterMask(w,h){

    ctx.fillStyle =
        "rgba(150,40,50,0.9)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        0,
        w*0.53,
        h*0.56,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle = "#ffe000";

    ctx.beginPath();

    ctx.arc(
        -w*0.20,
        -h*0.08,
        w*0.07,
        0,
        Math.PI*2
    );

    ctx.arc(
        w*0.20,
        -h*0.08,
        w*0.07,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.strokeStyle = "#ffffff";

    ctx.lineWidth = 5;

    ctx.beginPath();

    ctx.arc(
        0,
        h*0.12,
        w*0.25,
        0,
        Math.PI
    );

    ctx.stroke();

}


/* =====================================
   CYBER MASK
===================================== */

function cyberMask(w,h){

    ctx.strokeStyle = "#00eaff";

    ctx.lineWidth = 7;

    ctx.strokeRect(
        -w*0.5,
        -h*0.43,
        w,
        h*0.8
    );


    ctx.fillStyle =
        "rgba(0,220,255,0.15)";

    ctx.fillRect(
        -w*0.48,
        -h*0.41,
        w*0.96,
        h*0.76
    );


    ctx.strokeStyle = "#00ffff";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(
        -w*0.35,
        -h*0.08
    );

    ctx.lineTo(
        w*0.35,
        -h*0.08
    );

    ctx.stroke();

}


/* =====================================
   MAGIC MASK
===================================== */

function magicMask(w,h){

    ctx.strokeStyle = "#c86cff";

    ctx.lineWidth = 5;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        w*0.55,
        0,
        Math.PI*2
    );

    ctx.stroke();


    ctx.strokeStyle = "#55d9ff";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        w*0.67,
        0,
        Math.PI*2
    );

    ctx.stroke();


    for(let i=0;i<12;i++){

        const angle =
            i*Math.PI*2/12;

        const x =
            Math.cos(angle)*w*0.70;

        const y =
            Math.sin(angle)*w*0.70;

        ctx.fillStyle = "#ffffff";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =====================================
   PARTICLES
===================================== */

function particles(x,y){

    for(let i=0;i<25;i++){

        const angle =
            Math.random()*Math.PI*2;

        const radius =
            Math.random()*130;

        const px =
            x + Math.cos(angle)*radius;

        const py =
            y + Math.sin(angle)*radius;

        ctx.fillStyle = "#ffffff";

        ctx.beginPath();

        ctx.arc(
            px,
            py,
            2 + Math.random()*3,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =====================================
   SCANNER
===================================== */

function scanner(x,y,w,h){

    const offset =
        Math.sin(Date.now()/400)
        * h * 0.35;

    ctx.strokeStyle = "#00ffff";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(
        x-w*0.5,
        y+offset
    );

    ctx.lineTo(
        x+w*0.5,
        y+offset
    );

    ctx.stroke();

}


/* =====================================
   END
===================================== */

</script>

</body>
</html>
}
